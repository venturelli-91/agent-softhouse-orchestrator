name: ci
on:
  workflow_dispatch:
  push:
    paths: ["orchestrator/**", ".claude/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["orchestrator/**", ".claude/**", ".github/workflows/ci.yml"]
permissions:
  contents: read
defaults:
  run:
    working-directory: orchestrator
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      # Fake nodes: no model, no credentials.
      - run: npm test
